# 最后合并；将无额外capability的Agent身份读取与已登记目标
# 放入明确的AppArmor角色，UID、命名空间、挂载和预算保持不变。
services:
  agent:
    security_opt: !override
      - no-new-privileges:true
      - apparmor=drop-agent-controller
