# 阿里云旧2核/3.42GiB单机配置；在已选择的
# helper、tools、监控和HTTPS覆盖之后最后合并。单次采集
# 与分析并发均受限；这些是资源上限，不是SLA或性能承诺。
services:
  postgres: {mem_limit: 192m, memswap_limit: 192m}
  # 验收时MinIO初始化后约占227MiB匿名内存；预算仅256MiB时，
  # 即使未发生OOM，代码页回收也可能压满磁盘I/O，因此不能只按堆大小估算。
  storage-backend: {mem_limit: 512m, memswap_limit: 512m}
  minio: {mem_limit: 48m, memswap_limit: 48m}
  drop-server: {mem_limit: 128m, memswap_limit: 128m}
  api:
    mem_limit: 256m
    memswap_limit: 256m
    environment: {GOMEMLIMIT: 192MiB, GOMAXPROCS: '2'}
  analyzer:
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      ANALYSIS_MEMORY_BYTES: '536870912'
      ANALYZER_QUEUE: all
  agent: {mem_limit: 192m, memswap_limit: 192m}
  collector-helper: {mem_limit: 512m, memswap_limit: 512m}
  web: {mem_limit: 48m, memswap_limit: 48m}
  maintenance: {mem_limit: 96m, memswap_limit: 96m}
  prometheus:
    mem_limit: 128m
    memswap_limit: 128m
    environment: {GOMEMLIMIT: 96MiB}
  grafana:
    # Grafana13约498MiB可执行文件加冷启动读取会超过384MiB预算。
    # 应单独约束整个cgroup，而非只限制Go堆，避免持续回收导致停顿。
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.3
    environment:
      GOMEMLIMIT: 256MiB
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      # 此配置只接入Prometheus和Tempo，避免在小主机上启动
      # 无关的后端数据源进程并消耗额外资源。
      GF_PLUGINS_DISABLE_PLUGINS: cloudwatch,elasticsearch,graphite,influxdb,jaeger,loki,mssql,mysql,postgres,pyroscope,stackdriver,zipkin,grafana-azure-monitor-datasource,grafana-testdata-datasource
  alertmanager:
    mem_limit: 48m
    memswap_limit: 48m
    environment: {GOMEMLIMIT: 32MiB}
  otel-collector:
    mem_limit: 96m
    memswap_limit: 96m
    environment: {GOMEMLIMIT: 64MiB}
  tempo:
    mem_limit: 128m
    memswap_limit: 128m
    environment: {GOMEMLIMIT: 96MiB}
