# 仅用于隔离集成项目，始终使用-p dropfullstage及独立的
# secret与数据；公网仍指向生产，stage通过SSH隧道访问。
services:
  web:
    ports: !override ['127.0.0.1:18080:8080']
  api:
    environment:
      PUBLIC_URL: http://127.0.0.1:18080
  agent:
    environment:
      AGENT_HOSTNAME: aliyun-stage-full
  maintenance:
    volumes: !override ['/opt/drop-stage-full/monitoring:/var/drop-monitoring:ro']
  prometheus:
    ports: !override ['127.0.0.1:19090:9090']
  alertmanager:
    ports: !override ['127.0.0.1:19093:9093']
  grafana:
    ports: !override ['127.0.0.1:13000:3000']
  tempo:
    ports: !override ['127.0.0.1:13200:3200']
