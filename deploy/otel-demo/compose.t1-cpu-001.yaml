services:
  ad:
    build:
      context: ${MINI_DROP_OTEL_SOURCE_ROOT:?set MINI_DROP_OTEL_SOURCE_ROOT}
      dockerfile: src/ad/Dockerfile
      args:
        OTEL_JAVA_AGENT_VERSION: "2.30.0"
    image: mini-drop/otel-demo-ad:3684411
    environment:
      AD_PORT: "9555"
      AD_PROMETHEUS_PORT: "9465"
      FLAGD_HOST: flagd
      FLAGD_PORT: "8013"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=mini-drop-benchmark,service.version=3.0.0,service.criticality=medium
      OTEL_LOGS_EXPORTER: otlp
      OTEL_SERVICE_NAME: ad
      OTEL_EXPERIMENTAL_SDK_TELEMETRY_VERSION: latest
    depends_on:
      flagd:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "127.0.0.1::9555"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9555'"]
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 300m
    cpus: 0.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    labels:
      com.mini-drop.owner: ${MINI_DROP_OTEL_OWNER:-mini-drop}
      com.mini-drop.scenario: ${MINI_DROP_OTEL_SCENARIO:?set MINI_DROP_OTEL_SCENARIO}
      com.mini-drop.expires-at: ${MINI_DROP_OTEL_EXPIRES_AT:?set MINI_DROP_OTEL_EXPIRES_AT}
      com.mini-drop.fault-window-max-seconds: "120"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - fixture
