global:
  resolve_timeout: 2m
route:
  receiver: drop-audit
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: drop-audit
    webhook_configs:
      - url: http://maintenance:9105/alerts
        send_resolved: true
        max_alerts: 50
        http_config:
          authorization:
            credentials_file: /run/secrets/alert_webhook_token
