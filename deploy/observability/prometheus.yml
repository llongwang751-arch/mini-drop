global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: api
    static_configs: [{targets: ['api:8080']}]
  - job_name: analyzer
    static_configs: [{targets: ['analyzer:9102']}]
  - job_name: core
    static_configs: [{targets: ['drop-server:9101']}]
  - job_name: maintenance
    static_configs: [{targets: ['maintenance:9105']}]
  - job_name: agent
    static_configs: [{targets: ['agent:9103']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: tempo
    static_configs: [{targets: ['tempo:3200']}]
