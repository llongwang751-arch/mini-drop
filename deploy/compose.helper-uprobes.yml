# AppArmor宿主可选的旧版uprobe兼容；先使用
# apparmor_parser -r apparmor/drop-collector-helper加载专用配置。
# tracefs继续只读，helper只能写BCC必需的探针登记文件。
# 每次请求仍受到固定采集模板、已校验的分配器符号、选定PID/UID及
# 不可变进程身份检查约束，兼容配置不能绕过这些校验。
services:
  collector-helper:
    security_opt: !override
      - no-new-privileges:true
      - seccomp=./seccomp/agent-ebpf.json
      - apparmor=drop-collector-helper
    volumes:
      - type: bind
        source: /sys/kernel/tracing/uprobe_events
        target: /sys/kernel/tracing/uprobe_events
        bind:
          create_host_path: false
