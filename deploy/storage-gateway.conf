worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 server_tokens off;
 access_log off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 client_max_body_size 40m;
 map $http_x_amz_content_sha256 $unsafe_stream { default 0; ~*^STREAMING-UNSIGNED-PAYLOAD-TRAILER$ 1; }
 map $http_x_minio_source_replication_request $replication_header { default 1; '' 0; }
 server {
  listen 9000;
  # 社区MinIO没有针对这条代码路径发布补丁版本，因此把厂商
  # 文档中的缓解措施应用到所有内网与公网请求，而不只保护公网入口。
  if ($unsafe_stream) { return 403; }
  if ($replication_header) { return 403; }
  if ($arg_Action) { return 403; }
  location = / {
   limit_except GET HEAD { deny all; }
   proxy_pass http://storage-backend:9000;
   proxy_set_header Host $http_host;
  }
  location /minio/health/ {
   proxy_pass http://storage-backend:9000;
   proxy_set_header Host $http_host;
  }
  location /minio/ { return 403; }
  location / {
   # 只转发签名S3客户端实际需要的请求头；尤其
   # 不放行X-Minio-Replication-*或Snowball解压相关请求头。
   proxy_pass_request_headers off;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Authorization $http_authorization;
   proxy_set_header Content-Type $http_content_type;
   proxy_set_header Content-MD5 $http_content_md5;
   proxy_set_header Content-Encoding $http_content_encoding;
   proxy_set_header Range $http_range;
   proxy_set_header If-Match $http_if_match;
   proxy_set_header X-Amz-Date $http_x_amz_date;
   proxy_set_header X-Amz-Content-Sha256 $http_x_amz_content_sha256;
   proxy_set_header X-Amz-Security-Token $http_x_amz_security_token;
   proxy_set_header X-Amz-Meta-Sha256 $http_x_amz_meta_sha256;
   proxy_set_header X-Amz-Decoded-Content-Length $http_x_amz_decoded_content_length;
   proxy_set_header X-Amz-Trailer $http_x_amz_trailer;
   proxy_set_header X-Amz-Checksum-Crc32 $http_x_amz_checksum_crc32;
   proxy_set_header X-Amz-Checksum-Crc32c $http_x_amz_checksum_crc32c;
   proxy_set_header X-Amz-Checksum-Crc64nvme $http_x_amz_checksum_crc64nvme;
   proxy_set_header X-Amz-Checksum-Sha256 $http_x_amz_checksum_sha256;
   proxy_set_header X-Amz-Checksum-Sha1 $http_x_amz_checksum_sha1;
   proxy_set_header X-Amz-Sdk-Checksum-Algorithm $http_x_amz_sdk_checksum_algorithm;
   proxy_set_header Connection '';
   proxy_pass http://storage-backend:9000;
   proxy_request_buffering off;
   proxy_read_timeout 120s;
  }
 }
}
