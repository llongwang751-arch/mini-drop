# 在compose.release-20261019.yml之后合并，保留其他命名镜像与数据卷。
# 此API依赖追加式SQL迁移006，不能只换镜像而跳过schema前置条件。
services:
  migration:
    image: drop-api:20261020.1
  api:
    image: drop-api:20261020.1
    environment:
      AI_ENDPOINT: ${AI_ENDPOINT:-https://api.deepseek.com/chat/completions}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_API_KEY_FILE: /run/secrets/ai_api_key
    secrets: [ai_api_key]
  web:
    image: drop-web:20261020.1
secrets:
  ai_api_key:
    file: ./secrets/ai_api_key
