apiVersion: batch/v1
kind: Job
metadata:
  name: mini-drop-migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: mini-drop-python-worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python -m alembic upgrade head && python scripts/bootstrap_object_store.py
          envFrom:
            - configMapRef:
                name: mini-drop-runtime
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mini-drop-runtime
                  key: DATABASE_URL_PYTHON
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mini-drop-runtime
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mini-drop-runtime
                  key: MINIO_SECRET_KEY
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
