apiVersion: v1
kind: Service
metadata:
  name: apiserver
spec:
  selector: {app.kubernetes.io/name: apiserver}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: apiserver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: apiserver}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: apiserver}
      containers:
        - name: apiserver
          image: mini-drop-apiserver:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: mini-drop-runtime}
          env:
            - {name: MINI_DROP_API_LISTEN_ADDR, value: ":8080"}
            - {name: MINI_DROP_CONTROL_GRPC_ADDRESS, value: "control-plane:50051"}
            - {name: MINI_DROP_DIAGNOSTIC_AI_GRPC_ADDRESS, value: "diagnosis-worker:50061"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: DATABASE_URL_GO}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_SECRET_KEY}
            - name: MINI_DROP_API_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINI_DROP_API_KEY}
            - name: MINI_DROP_API_PRINCIPALS_JSON
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINI_DROP_API_PRINCIPALS_JSON}
            - name: MINI_DROP_GRPC_TOKEN
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINI_DROP_GRPC_TOKEN}
          readinessProbe:
            exec: {command: ["/usr/local/bin/mini-drop-apiserver", "--healthcheck"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["/usr/local/bin/mini-drop-apiserver", "--healthcheck"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
