apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: native-agent
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: native-agent}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: native-agent}
    spec:
      hostPID: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: native-agent
          image: mini-drop-native-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: mini-drop-runtime}
          env:
            - {name: AGENT_GRPC_ADDR, value: "control-plane:50051"}
            - name: AGENT_ID
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: MINI_DROP_GRPC_TOKEN
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINI_DROP_GRPC_TOKEN}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_SECRET_KEY}
            - {name: AGENT_RESULT_OUTBOX_DIR, value: /var/lib/mini-drop-agent/outbox}
          volumeMounts:
            - {name: sys-tracing, mountPath: /sys/kernel/tracing, readOnly: true}
            - {name: sys-debug, mountPath: /sys/kernel/debug, readOnly: true}
            - {name: outbox, mountPath: /var/lib/mini-drop-agent/outbox}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["SYS_PTRACE", "PERFMON", "BPF", "SYS_RESOURCE"]
              drop: ["ALL"]
      volumes:
        - name: sys-tracing
          hostPath: {path: /sys/kernel/tracing, type: Directory}
        - name: sys-debug
          hostPath: {path: /sys/kernel/debug, type: Directory}
        - name: outbox
          hostPath: {path: /var/lib/mini-drop-agent/outbox, type: DirectoryOrCreate}
