# Copy this file outside source control, replace every placeholder, then apply it
# before the Kustomize base. Never commit the populated Secret.
apiVersion: v1
kind: Secret
metadata:
  name: mini-drop-runtime
  namespace: mini-drop
type: Opaque
stringData:
  DATABASE_URL_GO: postgresql://USER:PASSWORD@POSTGRES-HA:5432/mini_drop?sslmode=require
  DATABASE_URL_PYTHON: postgresql+psycopg://USER:PASSWORD@POSTGRES-HA:5432/mini_drop?sslmode=require
  MINIO_ACCESS_KEY: REPLACE_ME
  MINIO_SECRET_KEY: REPLACE_ME
  MINI_DROP_API_KEY: REPLACE_ME
  MINI_DROP_API_PRINCIPALS_JSON: '{}'
  MINI_DROP_GRPC_TOKEN: REPLACE_ME
