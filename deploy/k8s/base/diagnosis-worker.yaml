apiVersion: v1
kind: Service
metadata:
  name: diagnosis-worker
spec:
  selector: {app.kubernetes.io/name: diagnosis-worker}
  ports:
    - {name: grpc, port: 50061, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: diagnosis-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: diagnosis-worker}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: diagnosis-worker}
      containers:
        - name: diagnosis-worker
          image: mini-drop-python-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "server.app.diagnosis_worker"]
          ports: [{name: grpc, containerPort: 50061}]
          envFrom:
            - configMapRef: {name: mini-drop-runtime}
          env:
            - {name: MINI_DROP_DIAGNOSTIC_AI_GRPC_PORT, value: "50061"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: DATABASE_URL_PYTHON}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINIO_SECRET_KEY}
          readinessProbe:
            exec: {command: ["python", "-m", "server.app.diagnosis_worker", "--healthcheck"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["python", "-m", "server.app.diagnosis_worker", "--healthcheck"]}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
