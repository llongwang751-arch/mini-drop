apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector: {app.kubernetes.io/name: control-plane}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: control-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: control-plane}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: control-plane}
      containers:
        - name: control-plane
          image: mini-drop-native-control:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: grpc, containerPort: 50051}]
          envFrom:
            - configMapRef: {name: mini-drop-runtime}
          env:
            - {name: NATIVE_CONTROL_LISTEN_ADDR, value: "0.0.0.0:50051"}
            - {name: NATIVE_CONTROL_HEALTH_ADDR, value: "127.0.0.1:50051"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: DATABASE_URL_GO}
            - name: MINI_DROP_GRPC_TOKEN
              valueFrom:
                secretKeyRef: {name: mini-drop-runtime, key: MINI_DROP_GRPC_TOKEN}
          readinessProbe:
            exec: {command: ["/usr/local/bin/mini-drop-native-control", "--healthcheck"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["/usr/local/bin/mini-drop-native-control", "--healthcheck"]}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
