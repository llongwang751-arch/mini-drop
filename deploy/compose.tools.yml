services:
  agent:
    image: drop-agent:${RELEASE_TAG:-build}
    build: {context: .., dockerfile: core/Dockerfile, target: full-tools}
    cap_add: [SYS_PTRACE]
    mem_limit: 512m
    tmpfs: ['/tmp:size=128m,mode=1777']
    environment:
      NATIVE_CONTROL_ROOT: /run/drop-profilers
    # 工具是否存在与内核/目标是否允许采集分别探测，不能只看安装结果。
    # 宿主PID或运行时访问由systemd/DaemonSet另行配置，不由本覆盖隐式开放。
