# 面向当时已授权2核/3.42GiB服务器的冻结发布配置，保留作历史依据。
# 在compose.yml、compose.tools.yml、compose.helper.yml、
# compose.helper-ebpf.yml和compose.https.yml之后合并；保留drop项目数据卷。
services:
  postgres: {mem_limit: 192m, memswap_limit: 192m}
  storage-backend: {mem_limit: 512m, memswap_limit: 512m}
  minio: {image: 'drop-nginx:20261018.1-rc2', mem_limit: 48m, memswap_limit: 48m}
  migration: {image: 'drop-api:20261018.1-rc4'}
  storage-init: {image: 'drop-analyzer:20261018.1-rc4'}
  backup-client: {image: 'drop-analyzer:20261018.1-rc4'}
  drop-server:
    image: drop-core:20261019.5
    mem_limit: 128m
    memswap_limit: 128m
  api:
    volumes:
      - ../contracts/task-kinds.json:/app/contracts/task-kinds.json:ro
    image: drop-api:20261018.1-rc4
    mem_limit: 256m
    memswap_limit: 256m
    environment: {GOMEMLIMIT: 192MiB, GOMAXPROCS: '2'}
  analyzer:
    image: drop-analyzer:20261018.1-rc4
    user: '10001:10001'
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    tmpfs: !override ['/tmp:size=256m,mode=1777']
    environment:
      ANALYZER_QUEUE: all
      ANALYSIS_MEMORY_BYTES: '536870912'
      ANALYSIS_DOWNLOAD_BYTES: '33554432'
      ANALYSIS_TEMP_BYTES: '201326592'
      ANALYSIS_MIN_FREE_BYTES: '16777216'
      ANALYSIS_CPU_SECONDS: '90'
      ANALYSIS_WALL_SECONDS: '120'
    healthcheck:
      test: [CMD, python, -m, drop_analyzer.health]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
  agent:
    image: drop-agent:20261019.5
    mem_limit: 192m
    memswap_limit: 192m
  collector-helper:
    image: drop-agent:20261019.5
    mem_limit: 512m
    memswap_limit: 512m
  web: {image: 'drop-web:20261019.3', mem_limit: 48m, memswap_limit: 48m}
  gateway: {image: 'drop-nginx:20261018.1-rc2', mem_limit: 48m, memswap_limit: 48m}
