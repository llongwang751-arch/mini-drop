# Optional overlay for docker-compose.control.yml. No host port is published.
# Build the migrate image with this overlay before starting the worker.
x-retrieval-env: &retrieval-env
  MINI_DROP_RETRIEVAL_MODE: hybrid
  SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?set SILICONFLOW_API_KEY in a private environment}
  MINI_DROP_CHROMA_HOST: chroma
  MINI_DROP_CHROMA_PORT: "8000"
  MINI_DROP_EMBEDDING_MODEL: Qwen/Qwen3-Embedding-4B
  MINI_DROP_EMBEDDING_DIMENSIONS: "1024"
  MINI_DROP_RERANK_MODEL: Qwen/Qwen3-Reranker-4B

services:
  migrate:
    build:
      args:
        INSTALL_RETRIEVAL: "1"
  chroma:
    image: chromadb/chroma:1.5.9
    expose: ["8000"]
    volumes: ["knowledge_chroma:/data"]
    restart: unless-stopped
  diagnosis-worker:
    environment: *retrieval-env
    depends_on:
      chroma: {condition: service_started}
  knowledge-index:
    profiles: ["retrieval-index"]
    image: mini-drop-python-worker:local
    command: ["python", "scripts/build_knowledge_index.py"]
    environment: *retrieval-env
    depends_on:
      chroma: {condition: service_started}
    restart: "no"

volumes:
  knowledge_chroma:
