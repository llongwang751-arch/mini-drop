# Mini-Drop strict replication topology
# React -> Go HTTP/SSE -> C++ Control/Agent -> MinIO -> Python workers.
# Python processes expose no public HTTP API.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_drop}
      POSTGRES_USER: ${POSTGRES_USER:-mini_drop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_drop}
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_drop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mini_drop}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mini_drop_secret}
    expose: ["9000", "9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/dockerfiles/python-worker.Dockerfile
    image: mini-drop-python-worker:local
    env_file: [.env]
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini_drop:mini_drop@postgres:5432/mini_drop}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: deploy/dockerfiles/native-control.Dockerfile
    image: mini-drop-native-control:local
    environment:
      NATIVE_CONTROL_LISTEN_ADDR: "0.0.0.0:50051"
      NATIVE_CONTROL_HEALTH_ADDR: "127.0.0.1:50051"
      DATABASE_URL: ${DATABASE_URL:-postgresql://mini_drop:mini_drop@postgres:5432/mini_drop}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_GRPC_AUTH_ENABLED: ${MINI_DROP_GRPC_AUTH_ENABLED:-0}
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:-}
      MINI_DROP_GRPC_SECURE: ${MINI_DROP_GRPC_SECURE:-0}
      MINI_DROP_GRPC_CERT_FILE: ${MINI_DROP_GRPC_CERT_FILE:-/certs/server.crt}
      MINI_DROP_GRPC_KEY_FILE: ${MINI_DROP_GRPC_KEY_FILE:-/certs/server.key}
      MINI_DROP_GRPC_CA_FILE: ${MINI_DROP_GRPC_CA_FILE:-/certs/ca.crt}
      MINI_DROP_GRPC_REQUIRE_CLIENT_CERT: ${MINI_DROP_GRPC_REQUIRE_CLIENT_CERT:-0}
      AGENT_OFFLINE_TIMEOUT_SEC: ${AGENT_OFFLINE_TIMEOUT_SEC:-30}
      MINI_DROP_CONTROL_MAINTENANCE_SEC: ${MINI_DROP_CONTROL_MAINTENANCE_SEC:-5}
    expose: ["50051"]
    volumes: ["./deploy/certs:/certs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/mini-drop-native-control", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  diagnosis-worker:
    image: mini-drop-python-worker:local
    pull_policy: never
    env_file: [.env]
    command: ["python", "-m", "server.app.diagnosis_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini_drop:mini_drop@postgres:5432/mini_drop}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mini_drop}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mini_drop_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_DIAGNOSTIC_AI_GRPC_PORT: "50061"
      MINI_DROP_DIAGNOSIS_POLL_SEC: ${MINI_DROP_DIAGNOSIS_POLL_SEC:-2}
      MINI_DROP_AGENT_FRAMEWORK: ${MINI_DROP_AGENT_FRAMEWORK:-langgraph}
      MINI_DROP_AGENT_CHECKPOINT_BACKEND: ${MINI_DROP_AGENT_CHECKPOINT_BACKEND:-postgres}
      MINI_DROP_AGENT_MEMORY_MAX_MESSAGES: ${MINI_DROP_AGENT_MEMORY_MAX_MESSAGES:-24}
      MINI_DROP_SCHEMA_MANAGED: "1"
      MINI_DROP_SOURCE_ROOTS: /workspace-source/server:/workspace-source/native
    expose: ["50061"]
    volumes:
      - "${MINI_DROP_SOURCE_PATH:-.}:/workspace-source:ro"
      - "./deploy/certs:/certs:ro"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "server.app.diagnosis_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  analyzer:
    image: mini-drop-python-worker:local
    pull_policy: never
    env_file: [.env]
    command: ["python", "-m", "server.app.analysis_jobs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://mini_drop:mini_drop@postgres:5432/mini_drop}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mini_drop}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mini_drop_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_ANALYZER_POLL_SEC: ${MINI_DROP_ANALYZER_POLL_SEC:-1}
      MINI_DROP_ANALYZER_LEASE_SEC: ${MINI_DROP_ANALYZER_LEASE_SEC:-120}
      MINI_DROP_ANALYZER_MAX_RETRIES: ${MINI_DROP_ANALYZER_MAX_RETRIES:-3}
      MINI_DROP_SCHEMA_MANAGED: "1"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "server.app.analysis_jobs", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  apiserver:
    build:
      context: .
      dockerfile: deploy/dockerfiles/apiserver.Dockerfile
    environment:
      MINI_DROP_API_LISTEN_ADDR: ":8080"
      MINI_DROP_CONTROL_GRPC_ADDRESS: "control-plane:50051"
      MINI_DROP_DIAGNOSTIC_AI_GRPC_ADDRESS: "diagnosis-worker:50061"
      MINI_DROP_DIAGNOSTIC_AI_GRPC_SERVER_NAME: ${MINI_DROP_DIAGNOSTIC_AI_GRPC_SERVER_NAME:-diagnosis-worker}
      MINI_DROP_CONTROL_GRPC_TIMEOUT_MS: ${MINI_DROP_CONTROL_GRPC_TIMEOUT_MS:-3000}
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:-}
      MINI_DROP_CONTROL_GRPC_TLS: ${MINI_DROP_GRPC_SECURE:-0}
      MINI_DROP_CONTROL_GRPC_CA_FILE: ${MINI_DROP_GRPC_CA_FILE:-/certs/ca.crt}
      MINI_DROP_CONTROL_GRPC_CLIENT_CERT_FILE: ${MINI_DROP_GRPC_CLIENT_CERT_FILE:-/certs/client.crt}
      MINI_DROP_CONTROL_GRPC_CLIENT_KEY_FILE: ${MINI_DROP_GRPC_CLIENT_KEY_FILE:-/certs/client.key}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mini_drop:mini_drop@postgres:5432/mini_drop}
      MINI_DROP_API_AUTH_ENABLED: ${MINI_DROP_API_AUTH_ENABLED:-0}
      MINI_DROP_API_KEY: ${MINI_DROP_API_KEY:-}
      MINI_DROP_API_PRINCIPALS_JSON: ${MINI_DROP_API_PRINCIPALS_JSON:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_AGENT_ENDPOINT: ${MINIO_AGENT_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-mini_drop}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-mini_drop_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
    expose: ["8080"]
    volumes: ["./deploy/certs:/certs:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      control-plane: {condition: service_healthy}
      diagnosis-worker: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/mini-drop-apiserver", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  native-agent:
    build:
      context: .
      dockerfile: deploy/dockerfiles/native-agent.Dockerfile
    image: mini-drop-native-agent:local
    environment:
      AGENT_GRPC_ADDR: control-plane:50051
      AGENT_ID: ${NATIVE_AGENT_ID:-agent_native_cpp}
      AGENT_HEARTBEAT_INTERVAL_SEC: ${AGENT_HEARTBEAT_INTERVAL_SEC:-5}
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:-}
      AGENT_GRPC_SECURE: ${MINI_DROP_GRPC_SECURE:-0}
      AGENT_GRPC_CA_CERT: ${AGENT_GRPC_CA_CERT:-/certs/ca.crt}
      AGENT_GRPC_CLIENT_CERT: ${AGENT_GRPC_CLIENT_CERT:-/certs/agent.crt}
      AGENT_GRPC_CLIENT_KEY: ${AGENT_GRPC_CLIENT_KEY:-/certs/agent.key}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      AGENT_RESULT_OUTBOX_DIR: /var/lib/mini-drop-agent/outbox
    depends_on:
      control-plane: {condition: service_healthy}
      minio: {condition: service_healthy}
    pid: host
    cap_add: ["SYS_PTRACE", "PERFMON", "BPF", "SYS_RESOURCE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - agentoutbox:/var/lib/mini-drop-agent/outbox
      - ./deploy/certs:/certs:ro
    restart: unless-stopped

  # Optional controlled CPU target used by the evidence-gate and Skill benchmark.
  python-hotspot:
    profiles: ["demo-target"]
    build: {context: demo/python-hotspot}
    pid: host
    environment: {CPU_HOTSPOT_ACTIVE: "1"}
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/dockerfiles/web.Dockerfile
    ports: ["80:80"]
    depends_on:
      apiserver: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  agentoutbox:
