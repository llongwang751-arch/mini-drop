<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title description">
  <title id="title">Mini-Drop 性能调查工作流</title>
  <desc id="description">描述问题与选择授权目标，创建任务或确认 AI 采集计划，现场采集或文件导入，解析与可视化，工具诊断与证据查看，复测与再次诊断，比较结果与形成结论，最后可选进行隔离源码修复与回归。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 9 4.5 0 9Z" fill="#6b87aa"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .node { fill: #f3f7ff; stroke: #c6d5eb; stroke-width: 1.5; }
      .label { fill: #17324f; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .badge { fill: #2165d4; }
      .number { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .connector { fill: none; stroke: #6b87aa; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="440" rx="16" fill="#fff"/>
  <text x="24" y="37" fill="#17324f" font-size="24" font-weight="700">从性能问题到验证结果</text>
  <text x="1096" y="36" fill="#61748b" font-size="15" text-anchor="end">MINI-DROP · 8 步工作流</text>
  <path class="connector" d="M260 131H298"/>
  <path class="connector" d="M540 131H578"/>
  <path class="connector" d="M820 131H858"/>
  <path class="connector" d="M982 190V258"/>
  <path class="connector" d="M864 323H826"/>
  <path class="connector" d="M584 323H546"/>
  <path class="connector" d="M304 323H266"/>
  <g transform="translate(24 72)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">1</text>
    <text class="label" x="118" y="62">描述问题</text><text class="label" x="118" y="92">选择授权目标</text>
  </g>
  <g transform="translate(304 72)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">2</text>
    <text class="label" x="118" y="62">创建任务或确认</text><text class="label" x="118" y="92">AI 采集计划</text>
  </g>
  <g transform="translate(584 72)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">3</text>
    <text class="label" x="118" y="62">现场采集</text><text class="label" x="118" y="92">或文件导入</text>
  </g>
  <g transform="translate(864 72)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">4</text>
    <text class="label" x="118" y="62">解析结果</text><text class="label" x="118" y="92">性能可视化</text>
  </g>
  <g transform="translate(864 264)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">5</text>
    <text class="label" x="118" y="62">工具诊断</text><text class="label" x="118" y="92">证据查看</text>
  </g>
  <g transform="translate(584 264)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">6</text>
    <text class="label" x="118" y="62">复测采集</text><text class="label" x="118" y="92">再次诊断</text>
  </g>
  <g transform="translate(304 264)">
    <rect class="node" width="236" height="118" rx="12"/>
    <circle class="badge" cx="23" cy="23" r="13"/><text class="number" x="23" y="28">7</text>
    <text class="label" x="118" y="62">比较结果</text><text class="label" x="118" y="92">形成结论</text>
  </g>
  <g transform="translate(24 264)">
    <rect width="236" height="118" rx="12" fill="#f6f4ff" stroke="#b7a8e4" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="23" cy="23" r="13" fill="#7251b5"/><text class="number" x="23" y="28">8</text>
    <text class="label" x="118" y="62">可选：源码修复</text><text class="label" x="118" y="92">隔离回归验证</text>
  </g>
  <text x="24" y="420" fill="#61748b" font-size="15">采集前审阅确认 · 证据可追溯 · 候选补丁在隔离副本验证</text>
</svg>
