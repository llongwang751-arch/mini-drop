        properties:
          cron:
            type: string
            minLength: 1
          interval_minutes:
            type: integer
            const: 0
      - required:
        - interval_minutes
        properties:
          cron:
            type: string
            maxLength: 0
          interval_minutes:
            type: integer
            minimum: 1
            maximum: 10080
