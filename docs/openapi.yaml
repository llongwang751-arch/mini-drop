    CodeRepair:
      type: object
      properties:
        id: *id003
        requested_by:
          type: string
        project_id:
          type: string
        source_revision:
          type: string
          pattern: ^[0-9a-f]{64}$
        goal:
          type: string
        input_digest:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - failed
          - canceled
        trace:
          type: array
          items: *id002
          maxItems: 12
        report:
          type:
          - object
          - 'null'
        error_code:
          type: string
        created_at: *id007
        updated_at: *id007
    Feedback:
      type: object
      properties:
