  /metrics:
    get:
      operationId: prometheus
      summary: Private Prometheus scrape
      tags:
      - Operations
      description: Private network only at deployment layer; no session cookie. Real SQL gauges and HTTP/gRPC histograms,
        no profile or credentials. See API development notes for metric names.
      responses:
        '200':
          description: Prometheus exposition
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      security: []
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: drop_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Token returned by login or auth/me. Required for every authenticated mutation, including logout/feedback/client
        telemetry.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Opaque key, no CR/LF/NUL. Scoped by owner and operation. Exact replay is safe; changed normalized
        request conflicts.
  responses:
    Error:
      description: 'Business error: 400 invalid input; 401 unauthenticated; 403 forbidden/CSRF/target; 404 absent
        or hidden; 409 state/idempotency/result; 410 expired artifact; 429 rate/quota; 503 offline capability/storage/provider;
        500 internal. No raw SQL/profile/secrets.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable: *id001
        details: *id002
      required:
      - code
      - message
      - retryable
      - details
    ErrorEnvelope:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
      required:
      - request_id
      - data
      - error
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role: &id008
          type: string
          enum:
          - viewer
          - operator
          - group_admin
          - platform_admin
          - admin
        created_at: *id007
      required:
      - id
      - username
      - display_name
      - role
      - created_at
    Auth:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
      required:
      - user
      - csrf_token
    AuthProviders:
      type: object
      properties:
        local: *id001
        oidc:
          type: object
          properties:
            enabled: *id001
            name:
              type: string
          required:
          - enabled
          - name
        ai:
          type: object
          properties:
            enabled: *id001
            name:
              type: string
          required:
          - enabled
          - name
      required:
      - local
      - oidc
      - ai
    Login:
      type: object
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          format: password
          maxLength: 72
      required:
      - username
      - password
      additionalProperties: false
    CreateUser:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_.-]{3,64}$
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
        display_name:
          type: string
          maxLength: 120
        role: *id008
      required:
      - username
      - password
      - role
      additionalProperties: false
    UpdateUser:
      type: object
      properties:
        role: *id008
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
      additionalProperties: false
    TaskTarget:
      type: object
      properties:
        type:
          type: string
          enum:
          - process
          - host
          - container
        pid:
          type: integer
          minimum: 2
          maximum: 2147483647
        start_time_ticks:
          type: integer
          minimum: 0
        container_id:
          type: string
        runtime:
          type: string
          enum:
          - docker
          - containerd
        container_pid:
          type: integer
          minimum: 0
          maximum: 2147483647
        expected_uid:
          type: integer
          minimum: 0
          maximum: 4294967295
        check_uid: *id001
      required:
      - type
      additionalProperties: false
      description: Target restrictions and UID/container allowlists are enforced by API and rechecked against actual
        OS identity by Agent.
    TaskBudget:
      type: object
      properties:
        max_file_bytes:
          type: integer
          minimum: 0
        max_address_space_bytes:
          type: integer
          minimum: 0
        max_cpu_seconds:
          type: integer
          minimum: 0
        max_processes:
          type: integer
          minimum: 0
        max_concurrency:
          type: integer
          minimum: 0
      additionalProperties: false
      description: Zero is omitted by normalization. Nonzero limits depend on the selected TaskKind parameter_schema;
        clients cannot override configured hard caps.
    TaskParameters:
      type: object
      properties:
        pid:
          type: integer
          minimum: 0
          maximum: 2147483647
        duration_seconds:
          type: integer
          minimum: 0
        frequency_hz:
          type: integer
          minimum: 0
        scope:
          type: string
          enum:
          - process
          - host
          - container
        target:
          $ref: '#/components/schemas/TaskTarget'
        budget:
          $ref: '#/components/schemas/TaskBudget'
        options: *id002
      additionalProperties: false
      description: Wire input before normalization. Zero/omitted duration and frequency use catalog defaults. options
        and normalized parameters must satisfy that kind's parameter_schema; source and traceparent are server-only
        and rejected in input.
    StoredTaskParameters:
      type: object
      properties:
        pid:
          type: integer
          minimum: 0
          maximum: 2147483647
        duration_seconds:
          type: integer
          minimum: 0
        frequency_hz:
          type: integer
          minimum: 0
        scope:
          type: string
          enum:
          - process
          - host
          - container
        target:
          $ref: '#/components/schemas/TaskTarget'
        budget:
          $ref: '#/components/schemas/TaskBudget'
        options:
          type: object
          additionalProperties: true
        source:
          type: string
          enum:
          - import
        traceparent:
          type: string
          readOnly: true
      additionalProperties: false
      description: Persisted normalized parameters. Imported input has source=import and no claimed live PID/duration/frequency.
        traceparent is injected by the API.
    ImportFile:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 120
        content_type:
          type: string
        data_base64:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 44739244
        format:
          type: string
      required:
      - filename
      - data_base64
      additionalProperties: false
      description: Strict base64, decoded 1 byte..32 MiB. Basename only; no paths/control characters. Filename/format
        must match the selected kind's auxiliary_artifacts allowlist.
    ImportInput:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 120
        content_type:
          type: string
        data_base64:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 44739244
        format:
          type: string
        auxiliary:
          type: array
          items:
            $ref: '#/components/schemas/ImportFile'
      required:
      - filename
      - data_base64
      additionalProperties: false
      description: Main file plus all auxiliary files must total at most 32 MiB; HTTP body at most 64 MiB. format
        defaults to the TaskKind input_format, and must match input_formats. Client content_type is accepted but
        storage content type is derived by the server. BOLT requires target.elf.
    CreateTask:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        kind:
          type: string
          enum: &id009
          - PERF_CPU
          - PROC_CPU
          - JAVA_CPU
          - GO_CPU
          - GO_HEAP
          - PYTHON_CPU
          - PYTHON_MEMORY
          - JAVA_HEAP
          - IO_TRACE
          - MEMORY_TRACE
          - GPERF_CPU
          - GPERF_HEAP
          - JEPROF_HEAP
          - BOLT_PROFILE
          - SCRIPT
          - RESOURCE_SNAPSHOT
          - IMPORT_COLLAPSED
        priority:
          type: integer
          minimum: -10
          maximum: 10
          default: 0
        target_agent_id:
          type: string
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        collapsed_text:
          type: string
        import:
          $ref: '#/components/schemas/ImportInput'
        group_id: &id010
          type:
          - string
          - 'null'
        visibility: &id011
          type: string
          enum:
          - private
          - group
          default: private
      required:
      - kind
      additionalProperties: false
      description: Use either a live Agent target, generic file import, or IMPORT_COLLAPSED collapsed_text (1 byte..2
        MiB). Import is checked before the legacy collapsed_text branch, so IMPORT_COLLAPSED accepts generic import
        too. Generic imports cannot include a nonempty target_agent_id or collapsed_text. Group visibility requires
        group_id. Name defaults to kind. All lengths enforced by Go are byte limits.
      anyOf:
      - required:
        - import
      - properties:
          kind:
            const: IMPORT_COLLAPSED
          collapsed_text:
            type: string
            minLength: 1
        required:
        - collapsed_text
      - properties:
          kind:
            type: string
            enum: &id016
            - PERF_CPU
            - PROC_CPU
            - JAVA_CPU
            - GO_CPU
            - GO_HEAP
            - PYTHON_CPU
            - PYTHON_MEMORY
            - JAVA_HEAP
            - IO_TRACE
            - MEMORY_TRACE
            - GPERF_CPU
            - GPERF_HEAP
            - JEPROF_HEAP
            - BOLT_PROFILE
            - SCRIPT
            - RESOURCE_SNAPSHOT
          target_agent_id:
            type: string
            minLength: 1
        required:
        - target_agent_id
      allOf:
      - if:
          required:
          - import
        then:
          properties:
            target_agent_id:
              type: string
              maxLength: 0
            collapsed_text:
              type: string
              maxLength: 0
      - if:
          properties:
            visibility:
              const: group
          required:
          - visibility
        then:
          required:
          - group_id
          properties:
            group_id:
              type: string
    TaskPermissions:
      type: object
      properties:
        read: *id001
        operate: *id001
        share: *id001
        delete: *id001
        reanalyze: *id001
      required:
      - read
      - operate
      - share
      - delete
      - reanalyze
      description: Computed by the same authorization service used by mutations. These flags describe authorization;
        lifecycle restrictions still apply.
    Task:
      type: object
      properties:
        id: *id003
        name:
          type: string
        kind:
          type: string
          enum: *id009
        priority:
          type: integer
          minimum: -10
          maximum: 10
        target_agent_id: *id010
        params:
          $ref: '#/components/schemas/StoredTaskParameters'
        collection_status:
          type: string
          enum:
          - CREATED
          - QUEUED
          - DELIVERED
          - RUNNING
          - UPLOADING
          - COLLECTED
          - FAILED
          - CANCELED
        analysis_status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - RETRY
          - SUCCESS
          - FAILED
          - CANCELED
        creator_id:
          type: string
        group_id: *id010
        visibility: *id011
        permissions:
          $ref: '#/components/schemas/TaskPermissions'
        request_id:
          type: string
        parent_task_id: *id003
        collection_deadline: *id007
        error_code:
          type: string
        error_message:
          type: string
        version:
          type: integer
        created_at: *id007
        updated_at: *id007
