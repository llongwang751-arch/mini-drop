        skip dependents. Required failure fails run. allow_partial_success admits optional failure only when some
        node succeeds. Overall deadline cancels unfinished child attempts. 200 idempotent replay; nodes/report are
        retrieved separately from detail.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/CompositeRun'
