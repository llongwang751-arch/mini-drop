        baseline_task_id: *id003
        candidate_task_id: *id003
        requested_by:
          type: string
        candidate_diagnosis_id: *id003
        status:
          type: string
          enum:
          - waiting
          - diagnosing
          - comparing
          - success
          - failed
          - canceled
        report:
          type:
          - object
          - 'null'
        error_code:
          type: string
        created_at: *id007
        updated_at: *id007
    CollectionPlan:
      type: object
      properties:
        kind:
          type: string
          enum: *id015
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 60
        frequency_hz:
          type: integer
          minimum: 0
          maximum: 999
        options: *id002
        rationale:
          type: string
          maxLength: 600
      additionalProperties: false
    InvestigationInput:
      type: object
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 600
