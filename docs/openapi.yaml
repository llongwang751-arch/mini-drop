    PartialAnalysisIdentity:
      type: object
      properties:
        analysis_job_id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Positive signed int64 decimal string; runtime also checks <=9223372036854775807.
        analysis_run:
          type: integer
          minimum: 1
          maximum: 2147483647
        input_artifact_id:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
