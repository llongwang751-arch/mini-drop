        storage content type is derived by the server. BOLT requires target.elf.
    CreateTask:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        kind:
          type: string
          enum: &id009
          - PERF_CPU
          - PROC_CPU
          - JAVA_CPU
          - GO_CPU
          - GO_HEAP
          - PYTHON_CPU
          - PYTHON_MEMORY
          - JAVA_HEAP
          - IO_TRACE
          - MEMORY_TRACE
          - GPERF_CPU
          - GPERF_HEAP
          - JEPROF_HEAP
          - BOLT_PROFILE
          - SCRIPT
          - RESOURCE_SNAPSHOT
          - IMPORT_COLLAPSED
        priority:
          type: integer
          minimum: -10
          maximum: 10
          default: 0
        target_agent_id:
          type: string
        parameters:
          $ref: '#/components/schemas/TaskParameters'
        collapsed_text:
          type: string
        import:
          $ref: '#/components/schemas/ImportInput'
        group_id: &id010
          type:
          - string
          - 'null'
        visibility: &id011
          type: string
          enum:
          - private
          - group
          default: private
      required:
      - kind
      additionalProperties: false
      description: Use either a live Agent target, generic file import, or IMPORT_COLLAPSED collapsed_text (1 byte..2
        MiB). Import is checked before the legacy collapsed_text branch, so IMPORT_COLLAPSED accepts generic import
        too. Generic imports cannot include a nonempty target_agent_id or collapsed_text. Group visibility requires
        group_id. Name defaults to kind. All lengths enforced by Go are byte limits.
      anyOf:
      - required:
        - import
      - properties:
          kind:
            const: IMPORT_COLLAPSED
          collapsed_text:
            type: string
            minLength: 1
        required:
        - collapsed_text
      - properties:
          kind:
            type: string
            enum: &id015
            - PERF_CPU
            - PROC_CPU
            - JAVA_CPU
            - GO_CPU
            - GO_HEAP
            - PYTHON_CPU
            - PYTHON_MEMORY
            - JAVA_HEAP
            - IO_TRACE
            - MEMORY_TRACE
            - GPERF_CPU
            - GPERF_HEAP
            - JEPROF_HEAP
            - BOLT_PROFILE
            - SCRIPT
            - RESOURCE_SNAPSHOT
          target_agent_id:
            type: string
            minLength: 1
        required:
        - target_agent_id
      allOf:
      - if:
          required:
          - import
        then:
          properties:
            target_agent_id:
              type: string
              maxLength: 0
            collapsed_text:
              type: string
              maxLength: 0
      - if:
          properties:
            visibility:
              const: group
          required:
          - visibility
        then:
          required:
          - group_id
          properties:
            group_id:
              type: string
