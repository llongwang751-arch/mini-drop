        project_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        goal:
          type: string
          minLength: 1
          maxLength: 600
        consent:
          const: true
          type: boolean
      required:
      - project_id
      - goal
      - consent
