# 由api/tools/sync_openapi.py生成，并与实际路由及共享Schema核对。
openapi: 3.1.0
info:
  title: Drop Diagnostics API
  version: 2.0.0
  description: 2026-10-21对照Gin handler、共享TaskKind与SQL迁移审阅。包括本地/OIDC身份、任务/节点授权、持久采集分析、诊断事实v2、受审方法与案例、业务信号目录、待审补证及隔离源码修复。JSON业务响应使用request_id/data/error；health/metrics/重定向/SSE例外。JSON输入闭合；工具与数据源由控制面登记，不能从模型参数取得任意URL、查询、命令或存储凭据。静态Schema与导入夹具不代表真实模型、生产或外部数据源已验收。
servers:
- url: /
  description: Same-origin deployment. UTC wire timestamps; display timezone may differ.
security:
- SessionCookie: []
tags:
- name: Authentication
- name: Overview
- name: Agents
- name: Tasks
- name: Groups
- name: Composites
- name: Schedules
- name: Suggestions
- name: Administration
- name: Operations
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Local password login
      tags:
      - Authentication
      description: 12-hour HttpOnly SameSite=Lax session; Secure according to HTTPS deployment. Login Origin must
        match PUBLIC_URL. PostgreSQL-shared limit 10 requests/IP/15min (all attempts).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Auth'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: []
  /api/v1/auth/providers:
    get:
      operationId: providers
      summary: Public configured feature flags
      tags:
      - Authentication
      description: Only provider display names and enabled flags. Never returns issuer, AI endpoint, credentials
        or internal addresses.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthProviders'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/auth/oidc/start:
    get:
      operationId: oidcStart
      summary: Begin OIDC authorization code + PKCE
      tags:
      - Authentication
      description: 302 browser redirect. Configured OIDC validates discovery/JWKS signature, issuer/audience/azp/expiry,
        one-use browser-bound state, nonce and PKCE. New identities default to viewer. Disabled returns 503 OIDC_UNAVAILABLE.
      responses:
        default:
          $ref: '#/components/responses/Error'
        '302':
          description: Redirect to IdP (start) or / (successful callback).
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Browser redirect location.
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly session or ten-minute browser binding cookie.
      security: []
  /api/v1/auth/oidc/callback:
    get:
      operationId: oidcCallback
      summary: Complete OIDC browser callback
      tags:
      - Authentication
      description: 302 browser redirect. Configured OIDC validates discovery/JWKS signature, issuer/audience/azp/expiry,
        one-use browser-bound state, nonce and PKCE. New identities default to viewer. Disabled returns 503 OIDC_UNAVAILABLE.
      responses:
        default:
          $ref: '#/components/responses/Error'
        '302':
          description: Redirect to IdP (start) or / (successful callback).
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Browser redirect location.
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly session or ten-minute browser binding cookie.
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: code
        in: query
        required: false
        schema:
          type: string
        description: ''
      security: []
  /api/v1/auth/me:
    get:
      operationId: currentUser
      summary: Current identity and CSRF token
      tags:
      - Authentication
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Auth'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      tags:
      - Authentication
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      logged_out: &id001
                        type: boolean
                    required:
                    - logged_out
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/overview:
    get:
      operationId: overview
      summary: Authorized resource overview
      tags:
      - Overview
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Overview'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
  /api/v1/agents:
    get:
      operationId: agents
      summary: List authorized Agents
      tags:
      - Agents
      description: Repository reads at most 500 authorized Agents, then applies search/status and pagination. total
        is within that bounded set, not an unbounded fleet count.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      page_size:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - total
                    - page
                    - page_size
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        description: ''
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - online
          - degraded
          - offline
          - disabled
        description: ''
  /api/v1/agents/{id}:
    get:
      operationId: agent
      summary: Authorized Agent detail
      tags:
      - Agents
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Agent'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    patch:
      operationId: setAgentEnabled
      summary: Enable or disable Agent
      tags:
      - Agents
      description: Platform administrator only. Persists disabled status and audit atomically; disabled Agent cannot
        self-enable via registration/heartbeat or claim new tasks.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Agent'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id006
              type: object
              properties:
                enabled: *id001
              required:
              - enabled
              additionalProperties: false
  /api/v1/agents/{id}/metrics:
    get:
      operationId: agentMetrics
      summary: Recent authorized Agent metrics
      tags:
      - Agents
      description: Last hour, up to 720 real persisted samples; no generated interpolation.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentMetric'
                    required:
                    - items
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /api/v1/agents/{id}/events:
    get:
      operationId: agentEvents
      summary: Recent persisted Agent events
      tags:
      - Agents
      description: Agent scope authorization, latest 100 rows ordered occurred_at/id descending. No pagination cursor
        is currently exposed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AgentEvent'
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      page_size:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - total
                    - page
                    - page_size
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /api/v1/agents/{id}/diagnostics:
    get:
      operationId: agentDiagnostics
      summary: Bounded control-plane diagnostics
      tags:
      - Agents
      description: Agent scope authorization and 4s mTLS RPC timeout. processes/events return arrays and request
        at most 100 entries. resources/capabilities return the persisted bounded JSON object. Returns DataJson directly;
        Core generated_at/truncated metadata is not exposed by this HTTP adapter. Not a complete inventory, no arbitrary
        paths or commands.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    oneOf:
                    - &id002
                      type: object
                      additionalProperties: true
                    - type: array
                      items: *id002
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - resources
          - capabilities
          - processes
          - events
          default: resources
        description: ''
  /api/v1/task-kinds:
    get:
      operationId: kinds
      summary: Shared TaskKind catalog
      tags:
      - Tasks
      description: All 18 catalog entries returned. With authorized agent_id, annotates available; does not filter
        offline-import kinds. Read parameter_schema dynamically rather than duplicating profiler options.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskKind'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
        description: ''
  /api/v1/tasks:
    get:
      operationId: tasks
      summary: List authorized tasks
      tags:
      - Tasks
      description: status matches collection_status OR analysis_status. Soft-deleted rows are omitted even for administrators.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      page_size:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - total
                    - page
                    - page_size
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
        description: ''
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
        description: ''
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: ''
    post:
      operationId: createTask
      summary: Create live or imported task
      tags:
      - Tasks
      description: Operator/group_admin/platform_admin (legacy admin) and authorized Agent/group scope. 201 new,
        200 exact idempotent replay, 409 same key/different normalized input. Shared owner quota 10 active tasks;
        one concurrent creation request per API process bounds import memory. Retry a 429/temporary storage error
        with the same key.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Task'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Task'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
  /api/v1/tasks/{id}:
    get:
      operationId: task
      summary: Task detail with server-calculated permissions
      tags:
      - Tasks
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/TaskDetail'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: &id003
          type: string
          pattern: ^[1-9][0-9]*$
          description: Database bigint encoded as a decimal string.
    delete:
      operationId: deleteTask
      summary: Soft-delete terminal task
      tags:
      - Tasks
      description: Owner, task-group administrator or platform administrator. Preserve artifacts/history and original
        retention. Nonterminal tasks return 409. operate share alone cannot delete.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data: &id004
                    type: object
                    properties:
                      deleted: *id001
                    required:
                    - deleted
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      summary: Cancel current collection or analysis
      tags:
      - Tasks
      description: Requires task operate permission and write-capable global role. Persists cancellation/event/outbox,
        fenced to collection attempt. No request body.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Task'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      summary: New collection attempt for terminal task
      tags:
      - Tasks
      description: New collection attempt, preserving history. Task operate scope and original owner's shared quota
        apply. Imported data cannot be recreated by an Agent retry; use a new import. No request body.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/Task'
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/tasks/{id}/reanalyze:
    post:
      operationId: reanalyze
      summary: Queue another analysis of existing RAW
      tags:
      - Tasks
      description: Platform administrator only. COLLECTED plus terminal success/failed analysis and readable unexpired
        RAW required. Archives old run/result/suggestions, clears current result, monotonically increases future
        run IDs. Refuses active pending/running/retry lease.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      id: *id003
                      analysis_status:
                        type: string
                        const: PENDING
                    required:
                    - id
                    - analysis_status
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - $ref: '#/components/parameters/CSRFToken'
  /api/v1/tasks/{id}/events:
    get:
      operationId: events
      summary: Persisted task events after sequence
      tags:
      - Tasks
      description: Current task read scope, up to 500 rows ascending by sequence. Returned total is this bounded
        batch length, not full history count.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      page_size:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - total
                    - page
                    - page_size
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - name: after
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
          default: '0'
        description: ''
  /api/v1/tasks/{id}/events/stream:
    get:
      operationId: stream
      summary: Resumable task and AI event stream
      tags:
      - Tasks
      description: text/event-stream, transport event name task_status, decimal sequence id, Event JSON as data.
        Last-Event-ID replays persisted later events. 1s poll/15s keepalive; session and current task scope rechecked
        every poll. Remains connected after task terminal state for AI events. SUGGESTION_DELTA payload {text,ai_request_id,streamed:true};
        CREATED/FAILED includes request id.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          pattern: ^[0-9]+$
  /api/v1/tasks/{id}/artifacts:
    get:
      operationId: artifacts
      summary: Authorized artifact metadata
      tags:
      - Tasks
      description: ''
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Artifact'
                      total:
                        type: integer
                        minimum: 0
                      page:
                        type: integer
                        minimum: 1
                      page_size:
                        type: integer
                        minimum: 0
                    required:
                    - items
                    - total
                    - page
                    - page_size
                  error:
                    type: 'null'
                required:
                - request_id
                - data
                - error
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id003
  /api/v1/tasks/{id}/artifacts/{artifact_id}/download:
    get:
      operationId: download
      summary: Authorize a short artifact download
      tags:
      - Tasks
      description: Rechecks task scope and artifact ready/download_allowed/retention state, audits each grant. 410
        if expired. URL valid at most 300s or remaining retention; short URL must not be logged. No long-lived object-store
        credential is sent to browser.
      responses:
        '200':
          description: Success
          content:
