      properties:
        id:
          type: string
        hostname:
          type: string
        ip:
          type: string
        version:
          type: string
        platform:
          type: string
        status:
          type: string
          enum:
          - online
          - degraded
          - offline
          - disabled
        capabilities:
          type: array
          items:
            type: string
        capability_details: *id002
        labels: *id002
        resources:
          $ref: '#/components/schemas/AgentResources'
        cpu_percent: *id013
        memory_percent: *id013
        load_average: *id013
        last_seen_at: *id007
        created_at: *id007
      required:
      - id
      - hostname
      - status
      - capabilities
      - capability_details
      - labels
      - resources
      - last_seen_at
      description: labels.registration is an object with protocol_version/build_commit/os/arch/kernel/tool_versions/certificate_expires_unix_ms.
        Do not render all label values as scalar strings.
    AgentMetric:
      type: object
      properties:
        created_at: *id007
        cpu_percent: *id013
        memory_percent: *id013
        load_average: *id013
      required:
      - created_at
      - cpu_percent
      - memory_percent
      - load_average
    AgentEvent:
      type: object
      properties:
        id: *id003
        agent_id:
          type: string
        event_id:
          type: string
        type:
          type: string
        payload: *id002
        occurred_at: *id007
        created_at: *id007
      required:
      - id
      - agent_id
      - event_id
      - type
      - payload
      - occurred_at
    TaskKind:
      type: object
      properties:
        id:
          type: string
          enum:
          - PERF_CPU
          - PROC_CPU
          - JAVA_CPU
          - GO_CPU
          - GO_HEAP
          - PYTHON_CPU
          - PYTHON_MEMORY
          - JAVA_HEAP
          - IO_TRACE
          - MEMORY_TRACE
          - GPERF_CPU
          - GPERF_HEAP
          - JEPROF_HEAP
          - BOLT_PROFILE
          - SCRIPT
          - RESOURCE_SNAPSHOT
          - IMPORT_COLLAPSED
          - COMPOSITE
        display_name:
          type: string
        description:
          type: string
        runner:
          type: string
        analysis_pipeline:
          type: string
        input_format:
          type: string
        input_formats:
          type: array
          items:
            type: string
        raw_name:
          type: string
        raw_content_type:
          type: string
        default_duration_seconds:
          type: integer
        max_duration_seconds:
          type: integer
        min_frequency_hz:
          type: integer
        max_frequency_hz:
          type: integer
        default_frequency_hz:
          type: integer
        requires_pid: *id001
        supported_os:
          type: array
          items:
            type: string
        supported_arch:
          type: array
          items:
            type: string
        supported_targets:
          type: array
          items:
            type: string
        parameter_schema: *id002
        parameters: *id002
        max_file_bytes:
          type: integer
        auxiliary_artifacts:
          type: array
          items: *id002
        tool_requirements:
          type: array
          items: *id002
        available: *id001
      required:
      - id
      - display_name
      - runner
      - analysis_pipeline
      - parameter_schema
      description: Passes through contracts/task-kinds.json (18 entries including COMPOSITE). agent_id annotates
        availability and does not hide offline-import kinds; COMPOSITE uses /composites rather than /tasks.
    Overview:
      type: object
      properties:
        agents_online:
          type: integer
        agents_total:
          type: integer
        tasks_total:
          type: integer
        tasks_running:
          type: integer
        tasks_success:
          type: integer
        storage_bytes:
          type: integer
        success_rate:
          type: number
          minimum: 0
          maximum: 100
        trend:
          type: array
          items:
            type: object
            properties:
              time: *id007
              total:
                type: integer
              success:
                type: integer
            required:
            - time
            - total
            - success
        recent_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        collection_counts:
          type: object
          additionalProperties:
            type: integer
        analysis_counts:
          type: object
          additionalProperties:
            type: integer
      required:
      - agents_online
      - agents_total
      - tasks_total
      - tasks_running
      - tasks_success
      - success_rate
      - trend
      - recent_tasks
      - collection_counts
      - analysis_counts
      - storage_bytes
      description: Scoped by the same resource authorization as list endpoints. success_rate is 0..100 percent.
        tasks_running includes COLLECTED plus analysis PENDING/RUNNING/RETRY; canceled/failed collection is excluded.
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created_at: *id007
      required:
      - id
      - name
      - description
      - created_at
    GroupMember:
      type: object
      properties:
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
        role: *id005
      required:
      - user_id
      - username
      - display_name
      - role
    AgentGrant:
      type: object
      properties:
        agent_id:
          type: string
        permission: *id014
      required:
      - agent_id
      - permission
    GroupDetail:
      allOf:
      - $ref: '#/components/schemas/Group'
      - type: object
        properties:
          members:
            type: array
            items:
              $ref: '#/components/schemas/GroupMember'
          agents:
            type: array
            items:
              $ref: '#/components/schemas/AgentGrant'
        required:
        - members
        - agents
    TaskShare:
      type: object
      properties:
        id: *id003
        task_id: *id003
        user_id: *id010
        group_id: *id010
        permission: *id014
        created_by:
          type: string
        created_at: *id007
      required:
      - id
      - task_id
      - permission
    CreateShare:
      type: object
      properties:
        user_id:
          type: string
        group_id:
          type: string
        permission: *id014
      required:
      - permission
      additionalProperties: false
      oneOf:
      - required:
        - user_id
        not:
          required:
          - group_id
      - required:
        - group_id
        not:
          required:
          - user_id
    CompositeNodeInput:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,47}$
        required: *id001
        depends_on:
          type: array
          items:
            type: string
        task:
          $ref: '#/components/schemas/CreateTask'
      required:
      - key
      - task
      additionalProperties: false
      description: Live collection only; no nested COMPOSITE, import, or collapsed_text. required defaults false.
        Missing/duplicate keys and cycles are rejected.
    CreateComposite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        group_id: *id010
        visibility: *id011
        deadline_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        allow_partial_success: *id001
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/CompositeNodeInput'
          minItems: 1
          maxItems: 16
      required:
      - name
      - deadline_seconds
      - nodes
      additionalProperties: false
    CompositeSummary:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    CompositeRun:
      type: object
      properties:
        id: *id003
        name:
          type: string
        creator_id:
          type: string
        group_id: *id010
        visibility: *id011
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCESS
          - PARTIAL_SUCCESS
          - FAILED
          - CANCELED
          - TIMED_OUT
        allow_partial_success: *id001
        deadline_at: *id007
        summary:
          $ref: '#/components/schemas/CompositeSummary'
        created_at: *id007
        updated_at: *id007
      required:
      - id
      - name
      - creator_id
      - status
      - deadline_at
      - summary
      - allow_partial_success
      - created_at
      - updated_at
    CompositeNode:
      type: object
      properties:
        id: *id003
        run_id: *id003
        key:
          type: string
        required: *id001
        depends_on:
          type: array
          items:
            type: string
        task_id: *id003
        status:
          type: string
          enum:
          - WAITING
          - RUNNING
          - SUCCESS
          - FAILED
          - SKIPPED
        error_code:
          type: string
        task:
          $ref: '#/components/schemas/Task'
        result: *id002
        created_at: *id007
        updated_at: *id007
      required:
      - id
      - run_id
      - key
      - required
      - depends_on
      - status
      - created_at
      - updated_at
    CompositeReport:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              node_key:
                type: string
              task_id: *id003
              summary: *id002
            required:
            - node_key
            - task_id
            - summary
        suggestions:
          type: array
          items:
            type: object
            properties:
              node_key:
                type: string
              task_id: *id003
              suggestion:
                $ref: '#/components/schemas/Suggestion'
            required:
            - node_key
            - task_id
            - suggestion
        limitations:
          type: array
          items:
            type: string
      required:
      - results
      - suggestions
      - limitations
    CompositeDetail:
      allOf:
      - $ref: '#/components/schemas/CompositeRun'
      - type: object
        properties:
          nodes:
            type: array
            items:
              $ref: '#/components/schemas/CompositeNode'
          report:
            $ref: '#/components/schemas/CompositeReport'
        required:
        - nodes
        - report
    CreateSchedule:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        interval_minutes:
          type: integer
          minimum: 0
          maximum: 10080
        cron:
          type: string
          description: Standard five-field minute/hour/day-of-month/month/day-of-week; no @ shortcuts or embedded
            TZ.
        timezone:
          type: string
          default: Asia/Shanghai
          description: Valid IANA name, including DST rules.
        group_id: *id010
        visibility: *id011
        template:
          $ref: '#/components/schemas/CreateTask'
      required:
      - template
      additionalProperties: false
      description: Choose cron or interval_minutes. Template is immutable, live collection only. Missed slots advance
        to the next future slot; no replay flood. Each record stores the template snapshot and unique scheduled_at.
      oneOf:
      - required:
        - cron
        properties:
          cron:
            type: string
            minLength: 1
          interval_minutes:
            type: integer
            const: 0
      - required:
        - interval_minutes
        properties:
          cron:
            type: string
            maxLength: 0
          interval_minutes:
            type: integer
            minimum: 1
            maximum: 10080
    Schedule:
      type: object
      properties:
        id: *id003
        creator_id:
          type: string
        name:
          type: string
        interval_minutes:
          type: integer
          minimum: 1
        cron:
          type: string
        timezone:
          type: string
        group_id: *id010
        visibility: *id011
        template:
          $ref: '#/components/schemas/CreateTask'
        enabled: *id001
        next_run_at: *id007
        last_run_at: *id007
        created_at: *id007
        updated_at: *id007
      required:
      - id
      - creator_id
      - name
      - interval_minutes
      - cron
      - timezone
      - template
      - enabled
      - next_run_at
      description: cron nonempty selects Cron mode; legacy non-null interval_minutes is 1 for Cron rows and must
        not be interpreted as their actual cadence.
    ScheduleRecord:
      type: object
      properties:
        id: *id003
        schedule_id: *id003
        task_id: *id010
        scheduled_at: *id007
        status:
          type: string
        error_message: *id010
        template_snapshot:
          $ref: '#/components/schemas/CreateTask'
        created_at: *id007
      required:
      - id
      - schedule_id
      - scheduled_at
      - status
      - template_snapshot
    Rule:
      type: object
      properties:
        key:
          type: string
        enabled: *id001
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        min_samples:
          type: integer
          minimum: 0
        threshold:
          type: number
          minimum: 0
          maximum: 100
        config: *id002
        version:
          type: integer
          minimum: 1
        updated_by: *id010
        updated_at: *id007
      required:
      - key
      - enabled
      - severity
      - min_samples
      - threshold
      - config
      - version
      - updated_at
    UpdateRule:
      type: object
      properties:
        enabled:
          type: boolean
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        min_samples:
          type: integer
          minimum: 0
        threshold:
          type: number
          minimum: 0
          maximum: 100
        config:
          type: object
          additionalProperties: true
      additionalProperties: false
      description: min_samples <=1e12; encoded config <=8192 bytes. Every update increments version and writes audit
        in one transaction.
    AIRequest:
      type: object
      properties:
        id: *id003
        task_id: *id003
        attempt_id: *id003
        requested_by:
          type: string
        input_digest:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - failed
        error_code:
          type: string
        created_at: *id007
        updated_at: *id007
      required:
      - id
      - task_id
      - attempt_id
      - requested_by
      - input_digest
      - status
      - created_at
      - updated_at
    FeedbackInput:
      type: object
      properties:
        rating:
          type: string
          enum:
          - useful
          - not_useful
        comment:
          type: string
      required:
      - rating
      additionalProperties: false
      description: Comment UTF-8 byte length <=1000. Upserts the current user's feedback for this suggestion.
    DiagnosisInput:
      type: object
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 600
        mode:
          type: string
          enum:
          - evidence
          - model
        consent: *id001
      required:
      - goal
      - mode
      additionalProperties: false
      description: Trimmed goal 1..600 Unicode characters, no control characters except LF/TAB. Model mode requires
        consent=true; evidence mode never calls a provider.
      allOf:
      - if:
          properties:
            mode:
              const: model
          required:
          - mode
        then:
          properties:
            consent:
              const: true
          required:
          - consent
    DiagnosisPlan:
      type: object
      properties:
        kind:
          type: string
          enum: *id015
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 60
        frequency_hz:
          type: integer
          minimum: 0
          maximum: 999
        reason:
          type: string
      required:
      - kind
      - duration_seconds
      - frequency_hz
      - reason
      additionalProperties: false
    DiagnosisHypothesis:
      type: object
      properties:
        claim:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
            pattern: ^E[1-8]$
          minItems: 1
          maxItems: 8
        verification:
          type: string
      required:
      - claim
      - evidence_ids
      - verification
      additionalProperties: false
    AgentRuntime:
      type: object
      properties:
        framework:
          type: string
          enum:
          - agentscope
        framework_version:
          type: string
          enum:
          - 2.0.10
        agent_class:
          type: string
          enum:
          - agentscope.agent.Agent
        run_id:
          type: string
          format: uuid
        model_calls:
          type: integer
          minimum: 0
          maximum: 8
        tool_calls:
          type: integer
          minimum: 0
          maximum: 12
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 425000
        usage:
          type: object
          maxProperties: 16
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 1000000000
      required:
      - framework
      - framework_version
      - agent_class
      - run_id
      - model_calls
      - tool_calls
      - elapsed_ms
      additionalProperties: false
      readOnly: true
      description: Server-derived execution proof, never model-authored. Planning stores it in an agent_runtime
        trace observation; diagnosis/source reports may include it. Absence is expected for historical or explicit
        legacy runs.
    DiagnosisReport:
      type: object
      properties:
        summary:
          type: string
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisHypothesis'
          minItems: 1
          maxItems: 4
        limitations:
          type: array
          items:
            type: string
        plan:
          $ref: '#/components/schemas/DiagnosisPlan'
        engine:
          type: string
          enum:
          - model
          - evidence
        model:
          type: string
        agent_runtime:
          $ref: '#/components/schemas/AgentRuntime'
      required:
      - summary
      - hypotheses
      - limitations
      - engine
      additionalProperties: false
    DiagnosisStep:
      type: object
      properties:
        evidence_id:
          type: string
          pattern: ^E[1-8]$
        tool:
