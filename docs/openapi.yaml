      required:
      - evidence_id
      - tool
      - observation
      additionalProperties: false
    DiagnosisRun:
      type: object
      properties:
        id: *id003
        task_id: *id003
        attempt_id: *id003
        analysis_job_id: *id003
        analysis_run:
          type: integer
          minimum: 0
        requested_by:
          type: string
        goal:
          type: string
        mode:
          type: string
          enum:
          - evidence
          - model
        input_digest:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - success
          - failed
        trace:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisStep'
          maxItems: 8
        report:
          anyOf:
          - $ref: '#/components/schemas/DiagnosisReport'
          - type: 'null'
        error_code:
          type: string
        created_at: *id007
        updated_at: *id007
      required:
      - id
      - task_id
      - attempt_id
      - analysis_job_id
      - analysis_run
      - requested_by
      - goal
      - mode
      - input_digest
      - status
      - trace
      - report
      - created_at
      - updated_at
    DiagnosisCollectInput:
      type: object
      properties:
        confirm:
          type: boolean
          const: true
      required:
      - confirm
      additionalProperties: false
    ProfileDifference:
