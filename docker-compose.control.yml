# 三机部署：仅在 Control VM 启动。Worker 使用 docker-compose.worker.yml。
# cp deploy/env/control.env.example deploy/env/control.env
# bash deploy/scripts/generate-dev-certs.sh <control-IP-or-DNS>
# docker compose --env-file deploy/env/control.env -f docker-compose.control.yml up -d --build

name: mini-drop-control

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_drop}
      POSTGRES_USER: ${POSTGRES_USER:-mini_drop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mini_drop}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    ports:
      - "${CONTROL_BIND_ADDRESS:-0.0.0.0}:${CONTROL_MINIO_PORT:-9000}:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/dockerfiles/server.Dockerfile
    image: mini-drop-control-analysis:local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane:
    build:
      context: .
      dockerfile: deploy/dockerfiles/native-control.Dockerfile
    image: mini-drop-control-native:local
    environment:
      NATIVE_CONTROL_LISTEN_ADDR: "0.0.0.0:50051"
      NATIVE_CONTROL_HEALTH_ADDR: "127.0.0.1:50051"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINIO_ENDPOINT: minio:9000
      MINIO_AGENT_ENDPOINT: ${MINIO_AGENT_ENDPOINT:?set the Control MinIO address reachable by Workers}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_GRPC_AUTH_ENABLED: "1"
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:?set MINI_DROP_GRPC_TOKEN}
      MINI_DROP_GRPC_SECURE: "1"
      MINI_DROP_GRPC_CERT_FILE: /certs/server.crt
      MINI_DROP_GRPC_KEY_FILE: /certs/server.key
      MINI_DROP_GRPC_CA_FILE: /certs/ca.crt
      MINI_DROP_GRPC_CLIENT_CERT_FILE: /certs/client.crt
      MINI_DROP_GRPC_CLIENT_KEY_FILE: /certs/client.key
      MINI_DROP_GRPC_REQUIRE_CLIENT_CERT: "1"
      MINI_DROP_GRPC_DISTRIBUTE_MINIO_CREDENTIALS: "0"
      AGENT_OFFLINE_TIMEOUT_SEC: ${AGENT_OFFLINE_TIMEOUT_SEC:-30}
      MINI_DROP_PROCESS_SNAPSHOT_RETENTION_PER_AGENT: ${MINI_DROP_PROCESS_SNAPSHOT_RETENTION_PER_AGENT:-120}
      MINI_DROP_PROCESS_SNAPSHOT_MAX_AGE_SEC: ${MINI_DROP_PROCESS_SNAPSHOT_MAX_AGE_SEC:-30}
    ports:
      - "${CONTROL_BIND_ADDRESS:-0.0.0.0}:${CONTROL_GRPC_PORT:-50051}:50051"
    volumes:
      - ./deploy/certs:/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/mini-drop-native-control", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  server:
    image: mini-drop-control-analysis:local
    pull_policy: never
    environment: &analysis_environment
      MINI_DROP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8191
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINIO_ENDPOINT: minio:9000
      MINIO_AGENT_ENDPOINT: ${MINIO_AGENT_ENDPOINT:?set the Control MinIO address reachable by Workers}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set externally reachable MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-0}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINIO_AUTO_CREATE_BUCKET: "1"
      MINI_DROP_API_AUTH_ENABLED: "1"
      MINI_DROP_API_KEY: ${MINI_DROP_API_KEY:?set MINI_DROP_API_KEY}
      MINI_DROP_INTERNAL_GATEWAY_TOKEN: ${MINI_DROP_INTERNAL_GATEWAY_TOKEN:?set MINI_DROP_INTERNAL_GATEWAY_TOKEN}
      MINI_DROP_GRPC_AUTH_ENABLED: "1"
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN}
      MINI_DROP_EMBED_GRPC: "0"
      MINI_DROP_EMBED_MAINTENANCE: "0"
      MINI_DROP_OUTBOX_DISPATCH_ENABLED: "1"
      MINI_DROP_SCHEMA_MANAGED: "1"
      MINI_DROP_ALLOWED_SERVICES: ${MINI_DROP_ALLOWED_SERVICES:-}
      MINI_DROP_AI_ENABLED: ${MINI_DROP_AI_ENABLED:-off}
      MINI_DROP_AI_PROVIDER: ${MINI_DROP_AI_PROVIDER:-deepseek}
      MINI_DROP_AI_BASE_URL: ${MINI_DROP_AI_BASE_URL:-https://api.deepseek.com}
      MINI_DROP_AI_API_KEY: ${MINI_DROP_AI_API_KEY:-}
      MINI_DROP_AI_MODEL: ${MINI_DROP_AI_MODEL:-deepseek-chat}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  diagnosis-worker:
    image: mini-drop-control-analysis:local
    pull_policy: never
    command: ["python", "-m", "server.app.diagnosis_worker"]
    environment:
      <<: *analysis_environment
      MINI_DROP_OUTBOX_DISPATCH_ENABLED: "0"
      MINI_DROP_DIAGNOSIS_POLL_SEC: ${MINI_DROP_DIAGNOSIS_POLL_SEC:-2}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  analyzer:
    image: mini-drop-control-analysis:local
    pull_policy: never
    command: ["python", "-m", "server.app.analysis_jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINI_DROP_ANALYZER_POLL_SEC: ${MINI_DROP_ANALYZER_POLL_SEC:-1}
      MINI_DROP_ANALYZER_LEASE_SEC: ${MINI_DROP_ANALYZER_LEASE_SEC:-120}
      MINI_DROP_ANALYZER_MAX_RETRIES: ${MINI_DROP_ANALYZER_MAX_RETRIES:-3}
      MINI_DROP_ANALYZER_RETRY_DELAY_SEC: ${MINI_DROP_ANALYZER_RETRY_DELAY_SEC:-5}
      MINI_DROP_SCHEMA_MANAGED: "1"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "server.app.analysis_jobs", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  apiserver:
    build:
      context: .
      dockerfile: deploy/dockerfiles/apiserver.Dockerfile
    environment:
      MINI_DROP_ENV: production
      MINI_DROP_API_LISTEN_ADDR: ":8080"
      MINI_DROP_ANALYSIS_ENGINE_URL: http://server:8191
      MINI_DROP_CONTROL_GRPC_ADDRESS: control-plane:50051
      MINI_DROP_CONTROL_GRPC_TIMEOUT_MS: ${MINI_DROP_CONTROL_GRPC_TIMEOUT_MS:-3000}
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN}
      MINI_DROP_CONTROL_GRPC_TLS: "1"
      MINI_DROP_CONTROL_GRPC_CA_FILE: /certs/ca.crt
      MINI_DROP_CONTROL_GRPC_CLIENT_CERT_FILE: /certs/client.crt
      MINI_DROP_CONTROL_GRPC_CLIENT_KEY_FILE: /certs/client.key
      MINI_DROP_CONTROL_GRPC_SERVER_NAME: ${CONTROL_PUBLIC_IP:-}
      MINI_DROP_PROCESS_SNAPSHOT_MAX_AGE_SEC: ${MINI_DROP_PROCESS_SNAPSHOT_MAX_AGE_SEC:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-mini_drop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mini_drop}
      MINI_DROP_API_AUTH_ENABLED: "1"
      MINI_DROP_API_KEY: ${MINI_DROP_API_KEY}
      MINI_DROP_INTERNAL_GATEWAY_TOKEN: ${MINI_DROP_INTERNAL_GATEWAY_TOKEN}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      MINIO_SECURE: "0"
    volumes:
      - ./deploy/certs:/certs:ro
    depends_on:
      control-plane:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/mini-drop-apiserver", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/dockerfiles/web.control.Dockerfile
    ports:
      - "${CONTROL_BIND_ADDRESS:-0.0.0.0}:${CONTROL_HTTP_PORT:-80}:80"
      - "${CONTROL_BIND_ADDRESS:-0.0.0.0}:${CONTROL_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/certs:/certs:ro
    depends_on:
      apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
