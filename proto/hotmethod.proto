// hotmethod.proto — 任务描述与结果上报服务
//
// 定义了 TaskDesc（任务描述，Server → Agent）和 TaskResult（结果上报，Agent → Server）。
// 这是整个系统最核心的消息结构——它描述了一次性能采集任务的完整参数和产出。

syntax = "proto3";

package mini_drop;

import "common.proto";
import "errorcode.proto";
import "taskkind.proto";
import "google/protobuf/empty.proto";

option go_package = "github.com/jiangyulin1/mini-drop/proto;mini_drop";


service Hotmethod {
  // Agent 采集完成后上报结果。
  rpc NotifyResult(TaskResult) returns (google.protobuf.Empty);
}


// TaskDesc 描述一次采集任务的完整参数。
// 嵌入在 HealthCheckResponse 中，Agent 心跳时拉取。
message TaskDesc {
  string task_id         = 1;  // 全局唯一任务 ID
  uint32 task_type       = 2;  // 任务大类: 0=通用 1=Java 2=Tracing 4=MemCheck 6=JavaHeap
  TaskKindProfiler profiler_type = 3;  // 唯一编号来自 contracts/taskkinds.json
  RecordArgv sample_argv = 4 [deprecated = true];  // N-1 兼容；新任务使用 typed payload
  string container_name  = 5;  // 容器/Pod 名称（非容器场景为空）
  uint32 container_type  = 6;  // 容器运行时类型
  uint32 timeout_sec     = 7;  // 任务超时秒数，Agent 应在此时限内完成采集
  CosConfig cos_config   = 8 [deprecated = true];  // 仅保留字段号兼容；Agent 不再接受长期密钥
  string script_content         = 9;   // 仅 ScriptExec 类任务使用，存放脚本内容
  reserved 10 to 19;                    // 预留给未来采集器参数
  string task_attempt_authority = 20;  // 不透明的任务尝试授权，Agent 必须原样回传
  repeated UploadTarget upload_targets = 21;  // 每对象短时 PUT 授权
  string task_attempt_id = 22;  // 本次真实执行身份，贯穿 Artifact/AnalysisJob
  ResourceBudget resource_budget = 23;  // 每任务上限，Agent 取本地与任务预算的较小值
  string traceparent = 24;  // 经控制面校验的 W3C Trace Context，不参与执行授权

  oneof payload {
    PerfTask perf = 30;
    AsyncProfilerTask async_profiler = 31;
    PprofTask pprof = 32;
    EbpfTask ebpf = 33;
    PySpyTask pyspy = 34;
    MemorySmapsTask memory_smaps = 35;
    SystemMetricsTask system_metrics = 36;
    ContinuousPerfTask continuous_perf = 37;
  }
}


// ResourceBudget 是单个任务的硬上限，不是性能目标。
message ResourceBudget {
  uint32 max_cpu_percent = 1;
  uint32 max_memory_mb = 2;
  uint32 max_output_mb = 3;
  uint32 max_duration_sec = 4;
}


message PerfTask {
  int32 pid = 1;
  uint32 hz = 2;
  uint32 duration_sec = 3;
  string callgraph = 4;
  string event = 5;
  bool subprocess = 6;
}


message AsyncProfilerTask {
  int32 pid = 1;
  uint32 duration_sec = 2;
  string event = 3;
}


message PprofTask {
  int32 pid = 1;
  uint32 duration_sec = 2;
  string endpoint = 3;
}


message EbpfTask {
  int32 pid = 1;
  uint32 duration_sec = 2;
  string device = 3;
}


message PySpyTask {
  int32 pid = 1;
  uint32 hz = 2;
  uint32 duration_sec = 3;
  bool subprocess = 4;
}


message MemorySmapsTask {
  int32 pid = 1;
  uint32 duration_sec = 2;
  uint32 interval_ms = 3;
}


message SystemMetricsTask {
  int32 pid = 1;
  uint32 duration_sec = 2;
  uint32 interval_ms = 3;
}


message ContinuousPerfTask {
  int32 pid = 1;
  uint32 hz = 2;
  uint32 duration_sec = 3;
  uint32 window_seconds = 4;
  string callgraph = 5;
  string event = 6;
  uint32 trigger_cpu_percent = 7;
  uint32 trigger_consecutive_samples = 8;
  uint32 trigger_wait_seconds = 9;
  string retention_tier = 10;
}


// RecordArgv 采集器的命令行参数。
message RecordArgv {
  uint32 hz         = 1;  // 采样频率 (Hz)，如 99
  uint64 duration   = 2;  // 采集时长 (秒)
  int32  pid        = 3;  // 目标进程 PID
  string callgraph  = 4;  // 调用栈展开模式: fp / dwarf / lbr
  bool   subprocess = 5;  // 是否包含子进程
  string event      = 6;  // perf event 类型，如 cpu-cycles / cache-misses
}


// TaskResult Agent 采集完成后上报的结果。
message TaskResult {
  string task_id                     = 1;
  string error_message               = 2;  // 空字符串表示成功，非空表示失败原因
  File   file                        = 3;  // 小文件内联（≤ 1MB），大文件走对象存储
  string cos_key                     = 4;  // 大文件的对象存储 key
  repeated PidStats self_pstats      = 5;  // 采集期间 Agent 自身资源时间序列
  repeated PidStats children_pstats  = 6;  // 子进程资源时间序列

  // artifact_type 和 artifact_metadata 用于描述产物的类型和元数据。
  // Server 收到后写入 artifacts 表。
  string artifact_type               = 7;  // raw / folded / flamegraph_svg / top_json / ebpf_metrics
  string artifact_metadata_json      = 8;  // JSON 序列化的元数据，含 bucket/object_key/content_type/size_bytes
  string task_attempt_authority       = 9;  // 原样回传 TaskDesc 中的不透明任务尝试授权
  ErrorCode error_code               = 10;  // 稳定错误码；文本仅作脱敏补充
}
