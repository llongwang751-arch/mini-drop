// healthcheck.proto — Agent 心跳与任务下发服务
//
// 这是 Agent ↔ Server 通信频率最高的 RPC（1 Hz）。
// Agent 每次心跳上报自身和子进程资源占用，
// Server 在响应中夹带待执行任务（如果有）。
// 一次 RPC 完成两件事：保活 + 任务拉取。

syntax = "proto3";

package mini_drop;

import "common.proto";
import "hotmethod.proto";

option go_package = "github.com/jiangyulin1/mini-drop/proto;mini_drop";


service HealthCheck {
  // Agent 每秒一次心跳，Server 在响应中返回待派任务。
  rpc Do(HealthCheckRequest) returns (HealthCheckResponse);
}


message HealthCheckRequest {
  string hostname          = 1;  // 主机名
  string ip_addr           = 2;  // IP 地址
  string agent_id          = 3;  // Agent 唯一 ID
  string agent_version     = 4;  // 当前版本
  PidStats self_pstats     = 5;  // Agent 自身资源开销
  PidStats children_pstats = 6;  // 采集器子进程聚合开销
  bool busy                = 7;  // Agent 正在执行任务时只心跳，不拉取新任务
  string active_task_id    = 8;  // Agent current task, used to receive cancellation

  ProcessCandidateSnapshot process_candidate_snapshot = 9;
}


message ProcessCandidate {
  uint32 pid                              = 1;
  uint64 process_start_ticks              = 2;
  uint64 pid_namespace_inode              = 3;
  uint32 namespace_pid                    = 4;
  string comm                             = 5;
  string executable_identity              = 6;
  string cgroup                           = 7;
  string service_hint                     = 8;
  string instance_hint                    = 9;
  repeated string collector_capabilities  = 10;
}


message ProcessCandidateSnapshot {
  uint64 generation              = 1;
  string boot_id                 = 2;
  uint64 observed_at_unix_ms     = 3;
  bool complete                  = 4;
  bool truncated                 = 5;
  repeated ProcessCandidate candidates = 6;
  string error                   = 7;
}


message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN     = 0;
    SERVING     = 1;  // Server 正常，Agent 继续心跳
    NOT_SERVING = 2;  // Server 即将关闭，Agent 应断开并等待重连
  }

  ServingStatus status  = 1;
  bool pending          = 2;         // true 表示有任务待执行
  TaskDesc task_desc    = 3;         // 待执行任务详情，仅在 pending=true 时有意义
  string cancel_task_id = 4;         // non-empty asks Agent to terminate this task
  string cancel_reason  = 5;         // structured cancellation reason
}
