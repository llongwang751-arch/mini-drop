worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 log_format clean '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
 access_log /dev/stdout clean;
 sendfile on;
 tcp_nopush on;
 keepalive_timeout 65;
 client_max_body_size 64m;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 10.0.0.0/8;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 gzip on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 map $http_x_forwarded_proto $forwarded_scheme { default $scheme; https https; }
 map $uri $cache_control { default 'no-cache'; ~^/assets/ 'public, max-age=31536000, immutable'; ~^/objects/ 'private, no-store'; /index.html 'no-store'; }
 map $uri $object_disposition { default ''; ~^/objects/ 'attachment'; }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control $cache_control always;
  add_header Content-Disposition $object_disposition always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location /api/ {
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $forwarded_scheme;
   proxy_set_header Connection '';
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 90s;
   proxy_send_timeout 30s;
   proxy_hide_header Server;
  }
  location /objects/ {
   limit_except GET HEAD { deny all; }
   proxy_pass http://minio:9000/;
   proxy_set_header Host minio:9000;
   proxy_set_header Authorization '';
   proxy_set_header Cookie '';
   proxy_hide_header Server;
  }
  location /assets/ { try_files $uri =404; }
  location = /index.html { }
  location / { try_files $uri $uri/ /index.html; }
 }
}
