# 前端容器只服务静态资源并转发同源请求，不保存应用、模型或对象存储的长期凭据。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 # 日志只记录不带查询参数的 $uri；预签名对象 URL 的签名不能落入访问日志。
 log_format clean '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
 access_log /dev/stdout clean;
 sendfile on;
 tcp_nopush on;
 keepalive_timeout 65;
 client_max_body_size 64m;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 10.0.0.0/8;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 gzip on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 map $http_x_forwarded_proto $forwarded_scheme { default $scheme; https https; }
 # 带哈希的构建资源可长期缓存；入口 HTML 与授权对象必须及时更新且不能公开缓存。
 map $uri $cache_control { default 'no-cache'; ~^/assets/ 'public, max-age=31536000, immutable'; ~^/objects/ 'private, no-store'; /index.html 'no-store'; }
 map $uri $object_disposition { default ''; ~^/objects/ 'attachment'; }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control $cache_control always;
  add_header Content-Disposition $object_disposition always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  # CSP 将脚本、网络和 Worker 限在同源；富文本还须经过应用自己的解析/清理，不能只依赖 CSP。
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location /api/ {
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $forwarded_scheme;
   proxy_set_header Connection '';
   # 任务 SSE 需要逐块送达浏览器，不能等待代理攒满缓冲后才显示进度。
   proxy_buffering off;
   proxy_request_buffering off;
   proxy_read_timeout 90s;
   proxy_send_timeout 30s;
   proxy_hide_header Server;
  }
  # 对象代理只允许只读下载，并剥离应用认证头与 Cookie；访问权限由短期签名表达。
  location /objects/ {
   limit_except GET HEAD { deny all; }
   proxy_pass http://minio:9000/;
   proxy_set_header Host minio:9000;
   proxy_set_header Authorization '';
   proxy_set_header Cookie '';
   proxy_hide_header Server;
  }
  location /assets/ { try_files $uri =404; }
  location = /index.html { }
  # BrowserRouter 的页面路径回退到入口 HTML；不存在的哈希资源仍在上面的 /assets/ 直接返回 404。
  location / { try_files $uri $uri/ /index.html; }
 }
}
