# One Linux host runs exactly one Mini-Drop Agent with host PID visibility.

name: mini-drop-worker

services:
  agent:
    build:
      context: .
      dockerfile: deploy/dockerfiles/native-agent.Dockerfile
      args:
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-http://mirrors.aliyun.com/ubuntu}
    image: mini-drop-native-agent:local
    environment:
      MINI_DROP_ENV: production
      AGENT_ID: ${AGENT_ID:?set a unique stable AGENT_ID}
      AGENT_IP_ADDR: ${AGENT_IP_ADDR:?set this Worker's reachable IP}
      AGENT_GRPC_ADDR: ${AGENT_GRPC_ADDR:?set Control host and gRPC port}
      AGENT_HEARTBEAT_INTERVAL_SEC: ${AGENT_HEARTBEAT_INTERVAL_SEC:-5}
      AGENT_GRPC_SECURE: "1"
      AGENT_GRPC_CA_CERT: /certs/ca.crt
      AGENT_GRPC_CLIENT_CERT: /certs/agent.crt
      AGENT_GRPC_CLIENT_KEY: /certs/agent.key
      AGENT_GRPC_TLS_SERVER_NAME: ${AGENT_GRPC_TLS_SERVER_NAME:?set the IP or DNS name used when the Control certificate was generated}
      MINI_DROP_GRPC_TOKEN: ${MINI_DROP_GRPC_TOKEN:?set the same token as Control}
      MINIO_BUCKET: ${MINIO_BUCKET:-mini-drop}
      AGENT_RESULT_OUTBOX_DIR: /var/lib/mini-drop-agent/outbox
      AGENT_RESULT_OUTBOX_MAX_ENTRIES: ${AGENT_RESULT_OUTBOX_MAX_ENTRIES:-256}
      NATIVE_AGENT_RUNNER_MAX_MEMORY_MB: ${NATIVE_AGENT_RUNNER_MAX_MEMORY_MB:-1024}
      NATIVE_AGENT_RUNNER_MAX_OUTPUT_MB: ${NATIVE_AGENT_RUNNER_MAX_OUTPUT_MB:-256}
    pid: host
    cap_add: ["SYS_PTRACE", "PERFMON", "BPF", "SYS_RESOURCE"]
    # Ubuntu's docker-default AppArmor profile denies cross-process /proc reads
    # even when SYS_PTRACE and host PID mode are enabled. The Agent needs those
    # reads to attest immutable process identities before accepting a target PID.
    security_opt:
      - "no-new-privileges:true"
      - "apparmor:unconfined"
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - agentoutbox:/var/lib/mini-drop-agent/outbox
      - "${AGENT_CERT_DIR:?set the directory containing ca.crt, agent.crt and agent.key}:/certs:ro"
    restart: unless-stopped

volumes:
  agentoutbox:
