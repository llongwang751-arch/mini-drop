syntax = "proto3";
package drop.v1;
option go_package = "drop/api/gen/dropv1";

message Empty {}
message Ack { bool ok = 1; string error_code = 2; string message = 3; }
message AgentInfo {
  string agent_id = 1;
  string hostname = 2;
  string ip = 3;
  string version = 4;
  string platform = 5;
  repeated string capabilities = 6;
  string labels_json = 7;
  int32 protocol_version = 8;
}
message InitResponse { int32 heartbeat_seconds = 1; int32 protocol_version = 2; }
message HeartbeatRequest {
  string agent_id = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  double load_average = 4;
  repeated int64 running_attempt_ids = 5;
  string resources_json = 6;
}
message TaskParameters {
  int32 pid = 1;
  int32 duration_seconds = 2;
  int32 frequency_hz = 3;
  string scope = 4;
}
message TaskDesc {
  int64 task_id = 1;
  int64 attempt_id = 2;
  string kind = 3;
  string target_agent_id = 4;
  TaskParameters parameters = 5;
  int64 deadline_unix_ms = 6;
  string raw_upload_url = 7;
  string raw_object_key = 8;
  string request_id = 9;
  int64 max_file_bytes = 10;
}
message HeartbeatResponse {
  repeated TaskDesc tasks = 1;
  repeated int64 cancel_attempt_ids = 2;
}
message CollectRequest { string agent_id = 1; }
message ProgressRequest {
  string agent_id = 1;
  int64 task_id = 2;
  int64 attempt_id = 3;
  string status = 4;
  string error_code = 5;
  string error_message = 6;
}
message ArtifactInfo {
  string object_key = 1;
  int64 size = 2;
  string sha256 = 3;
  string content_type = 4;
  string name = 5;
}
message ResultRequest {
  string agent_id = 1;
  int64 task_id = 2;
  int64 attempt_id = 3;
  bool success = 4;
  ArtifactInfo artifact = 5;
  string error_code = 6;
  string error_message = 7;
  int32 exit_code = 8;
}
message TaskReference { int64 task_id = 1; string request_id = 2; int64 attempt_id = 3; }
message AgentReference { string agent_id = 1; }
message AgentStats { string resources_json = 1; }
service InitAgent { rpc Init(AgentInfo) returns (InitResponse); }
service HealthCheck { rpc Do(HeartbeatRequest) returns (HeartbeatResponse); }
service Hotmethod {
  rpc Collect(CollectRequest) returns (HeartbeatResponse);
  rpc ReportProgress(ProgressRequest) returns (Ack);
  rpc NotifyResult(ResultRequest) returns (Ack);
}
service Control {
  rpc CreateTask(TaskDesc) returns (Ack);
  rpc CancelTask(TaskReference) returns (Ack);
  rpc StatAgent(AgentReference) returns (AgentStats);
  rpc Ping(Empty) returns (Ack);
}
