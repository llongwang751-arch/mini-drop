name: signed-multiarch-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  images:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: drop-core, dockerfile: core/Dockerfile, target: runtime}
          - {image: drop-agent, dockerfile: core/Dockerfile, target: full-tools}
          - {image: drop-api, dockerfile: api/Dockerfile, target: ''}
          - {image: drop-analyzer, dockerfile: analyzer/Dockerfile, target: ''}
          - {image: drop-agent-runtime, dockerfile: agent_runtime/Dockerfile, target: ''}
          - {image: drop-web, dockerfile: web/Dockerfile, target: ''}
          - {image: drop-ops, dockerfile: ops/Dockerfile, target: ''}
          - {image: drop-nginx, dockerfile: deploy/Dockerfile.nginx, target: ''}
    steps:
      - uses: actions/checkout@v4
      - id: names
        env:
          INPUT_TAG: ${{ inputs.tag }}
          COMPONENT: ${{ matrix.image }}
        run: |
          [[ "$INPUT_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$ ]] || exit 2
          printf 'image=ghcr.io/%s/%s\n' "${GITHUB_REPOSITORY,,}" "$COMPONENT" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign immutable multi-architecture image digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
