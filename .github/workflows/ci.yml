name: quality
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24.15.0', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm exec -- prettier --check src
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.preview.config.ts
        env:
          DROP_UI_PREVIEW: '1'
      - run: npx playwright test --config playwright.diagnosis.config.ts
      - name: Diagnostic knowledge UI and review/revoke boundaries (imported fixtures)
        run: npx playwright test --config playwright.knowledge.config.ts
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: drop_test, POSTGRES_PASSWORD: ci-ephemeral-test-password, POSTGRES_DB: drop_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U drop_test -d drop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults: {run: {working-directory: api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.9', cache-dependency-path: api/go.sum}
      - run: go test -race ./...
        env:
          TEST_DATABASE_URL: postgresql://drop_test:ci-ephemeral-test-password@localhost:5432/drop_test?sslmode=disable
          TEST_MIGRATION_FILE: ${{ github.workspace }}/db/migrations/001_initial.sql
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: test -z "$(gofmt -l .)"
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target build -t drop-core-test -f core/Dockerfile .
  analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned MinIO fixture from official release binary
        run: docker build --platform linux/amd64 --build-arg TARGETARCH=amd64 -t minio/minio:RELEASE.2025-07-23T15-54-02Z -f deploy/minio/Dockerfile .
      - run: docker build -t drop-analyzer:build -f analyzer/Dockerfile .
      - run: sh analyzer/scripts/run-isolated-integration.sh
  agent-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent_runtime/requirements.lock
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r agent_runtime/requirements.lock
      - run: python -m pip check
      - name: Native AgentScope ReAct and Linux Unix-socket regressions (imported fixtures)
        run: python -m unittest discover -s agent_runtime/tests -v
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent_runtime/requirements.lock
      # 复用已校验的依赖锁，包含PyYAML/jsonschema及完整传递依赖。
      # 契约验证不能依赖CI执行机碰巧预装了哪些包。
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r agent_runtime/requirements.lock
      - run: python -m pip check
      - run: python scripts/check_contracts.py
      - run: python -m unittest discover -s scripts -p test_dev.py -v
      - name: Portable external source packaging (imported synthetic repositories)
        run: python -m unittest discover -s scripts -p test_integration_packages.py -v
      - run: python scripts/check_proto_compatibility.py
      - run: python api/tools/check_http_contract.py
      - name: Diagnostic evaluation provenance, scoring and analyzer replay (imported synthetic fixtures)
        run: python -m unittest discover -s scripts/evaluation -p 'test_*.py' -v
  maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: docker/setup-compose-action@v2.0.0
        with: {version: 'v2.40.3'}
      - run: docker compose version
      - run: pip install --require-hashes -r ops/requirements.lock
      - run: pip install PyYAML==6.0.3
      - name: Ops native configuration and bounded logging
        run: python -m unittest discover -s ops -p test_runtime_config.py -v
      - name: Source patch context and sandbox boundary regressions
        run: python -m unittest discover -s ops -p test_code_executor.py -v
      - name: Python output types must survive performance optimization
        run: python -m unittest discover -s integrations/crm-python/tests -v
      - name: Optional monitoring status cannot break real HTTP metrics
        run: python -m unittest discover -s ops -p test_metrics.py -v
      - name: Owned helper cleanup recovery
        run: python -m unittest discover -s core/tests -p advanced_cleanup_test.py -v
      - name: Stage validation safety boundaries
        run: python -m unittest discover -s scripts/validation -p test_stage_*.py -v
      - run: python -m unittest discover -s ops -p test_isolated_runner.py
      - run: python -m unittest discover -s analyzer/scripts -p test_integration_runner.py
      - run: python -m unittest discover -s deploy/tests -p test_backup_metadata.py
      - run: python -m unittest discover -s deploy/tests -p test_s3_encryption_probe.py
      - run: python -m unittest discover -s deploy/tests -p test_capture_release_evidence.py
      - run: python -m unittest discover -s deploy/tests -p test_helper_deployment.py
      - name: AgentScope complete Compose merge and hostile overlay boundaries (imported fixtures)
        run: python -m unittest discover -s deploy/tests -p test_agentscope_deployment.py -v
      - name: Helper spool provisioning boundaries (fake mount commands)
        run: python -m unittest discover -s deploy/tests -p test_helper_spool.py -v
      - name: Build pinned MinIO fixture from official release binary
        run: docker build --platform linux/amd64 --build-arg TARGETARCH=amd64 -t minio/minio:RELEASE.2025-07-23T15-54-02Z -f deploy/minio/Dockerfile .
      - run: docker build -t drop-ops:ci -f ops/Dockerfile .
      - run: OPS_TEST_IMAGE=drop-ops:ci bash ops/run-isolated-integration.sh
      - run: python scripts/render_kubernetes.py && git diff --exit-code -- deploy/kubernetes
      - run: docker run --rm -v "$PWD/deploy/observability:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - run: docker run --rm -v "$PWD/deploy/observability:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.0 test rules /etc/prometheus/alerts.test.yml
